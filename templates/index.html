<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Chess Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Genetic Chess Engine</h1>
            <p class="tagline">Play against an AI that evolves with genetic algorithms</p>
        </header>

        <main>
            <div class="game-area">
                <div class="board-container">
                    <div class="coordinates x-coords" aria-hidden="true">
                        <div>a</div>
                        <div>b</div>
                        <div>c</div>
                        <div>d</div>
                        <div>e</div>
                        <div>f</div>
                        <div>g</div>
                        <div>h</div>
                    </div>
                    <div class="coordinates y-coords" aria-hidden="true">
                        <div>8</div>
                        <div>7</div>
                        <div>6</div>
                        <div>5</div>
                        <div>4</div>
                        <div>3</div>
                        <div>2</div>
                        <div>1</div>
                    </div>
                    <div id="chessboard"></div>
                    <div id="promotion-modal">
                        <div class="promotion-pieces">
                            <div data-piece="q" class="promotion-piece">♕</div>
                            <div data-piece="r" class="promotion-piece">♖</div>
                            <div data-piece="b" class="promotion-piece">♗</div>
                            <div data-piece="n" class="promotion-piece">♘</div>
                        </div>
                    </div>
                </div>

                <div class="game-controls">
                    <div class="game-info">
                        <div class="status-card">
                            <h3>Game Status</h3>
                            <div id="game-status">Waiting to start...</div>
                            <div id="move-history-container">
                                <h4>Move History</h4>
                                <div id="move-history"></div>
                            </div>
                        </div>
                    </div>
                    <div class="controls">
                        <div class="difficulty-settings">
                            <h3>AI Difficulty</h3>
                            <div class="difficulty-buttons">
                                <button id="easy-btn" class="difficulty-btn">Easy</button>
                                <button id="medium-btn" class="difficulty-btn active">Medium</button>
                                <button id="hard-btn" class="difficulty-btn">Hard</button>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button id="new-game-btn" class="primary-btn">New Game</button>
                            <button id="evolve-btn" class="secondary-btn">Evolve AI</button>
                            <div class="evolve-options hidden" id="evolve-options">
                                <label for="generations">Generations:</label>
                                <input type="number" id="generations" min="5" max="100" value="10">
                                <button id="confirm-evolve-btn" class="small-btn">Confirm</button>
                                <button id="cancel-evolve-btn" class="small-btn">Cancel</button>
                            </div>
                            <button id="undo-btn" class="secondary-btn" disabled>Undo Move</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="notification" class="notification hidden">
            <div class="notification-content">
                <span id="notification-message"></span>
                <button id="close-notification" aria-label="Close notification">×</button>
            </div>
        </div>

        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <div id="loading-message">Processing...</div>
        </div>

        <footer>
            <p>Created with 💡 | <a href="https://github.com" target="_blank" rel="noopener noreferrer">View on GitHub</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/chessboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
